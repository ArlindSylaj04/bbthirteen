  <meta name="omelette-owns-print" content="1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Rubik', sans-serif; }
    a { color: var(--accent-tx, #5f7d10); text-decoration: none; }
    a:hover { filter: brightness(1.15); }
    /* ── Shared theme tokens — single source (Defect Management design system), mirrored verbatim in every view ── */
    :root {
      /* brand */
      --brand:#95c11f; --brand-deep:#7ba00f; --brand-dark:#5f7d10; --brand-light:#b6df3f;
      /* radii + motion — one scale for the whole cockpit */
      --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
      --ease:cubic-bezier(.4,0,.2,1); --dur:0.18s;
      /* the masthead is a dark brand surface in both themes */
      --hd-bg:linear-gradient(135deg,#232830 0%,#15181e 60%,#111419 100%);
      --hd-brd:rgba(255,255,255,0.13); --hd-brd-2:rgba(255,255,255,0.22);
      --hd-soft:rgba(255,255,255,0.07); --hd-soft-2:rgba(255,255,255,0.12);
      --hd-tx:#e8ecf2; --hd-tx-mut:#a4adbb; --hd-tx-faint:#7d8795;
    }
    [data-theme="light"] {
      --card-bg:#ffffff; --card-bg2:#f5f7fb; --card-brd:#e3e8f0;
      --brd-2:#d5dce7; --brd-sub:#edf1f7; --track:#e8ecf3;
      --input-bg:#f4f7fb; --tile-bg:#f7f9fc; --bg-deep:#eceff5;
      --tx:#2a3442; --tx-strong:#111926; --tx-mut:#5b6879; --tx-lbl:#6b7889; --tx-soft:#36445a;
      --tx-val:#25314a; --tx-fnt:#86929f; --tx-faint:#9ba6b5; --accent-tx:#5f7d10;
      --shadow:0 1px 2px rgba(18,28,48,0.05), 0 6px 20px rgba(18,28,48,0.06);
      --shadow-lg:0 2px 4px rgba(18,28,48,0.06), 0 18px 44px rgba(18,28,48,0.12);
      --ring:rgba(149,193,31,0.30);
      /* soft semantic tints — the one place a status surface is defined */
      --soft-ok:#f0fdf4; --soft-bad:#fef2f2; --soft-warn:#fffbeb;
      --soft-info:#eff6ff; --soft-purple:#f5f3ff; --soft-neutral:#f6f8fc;
      /* modals must be opaque — a translucent dialog over a dense report is unreadable */
      --modal-bg:#ffffff; --modal-bg2:#f5f7fb;
      --soft-ok-brd:#bbf7d0; --soft-bad-brd:#fecaca; --soft-warn-brd:#fde68a;
      --soft-info-brd:#bfdbfe; --soft-purple-brd:#ddd6fe;
    }
    [data-theme="dark"] {
      --card-bg:rgba(255,255,255,0.042); --card-bg2:rgba(255,255,255,0.055); --card-brd:rgba(255,255,255,0.085);
      --brd-2:rgba(255,255,255,0.135); --brd-sub:rgba(255,255,255,0.07); --track:rgba(255,255,255,0.065);
      --input-bg:rgba(0,0,0,0.28); --tile-bg:rgba(255,255,255,0.035); --bg-deep:#080b12;
      --tx:#e7ecf7; --tx-strong:#ffffff; --tx-mut:#a3b1c9; --tx-lbl:#8b9ab4; --tx-soft:#c9d4e8;
      --tx-val:#dde6f7; --tx-fnt:#7b8ba6; --tx-faint:#66748d; --accent-tx:#b6df3f;
      --shadow:0 1px 2px rgba(0,0,0,0.30), 0 10px 28px rgba(0,0,0,0.34);
      --shadow-lg:0 2px 6px rgba(0,0,0,0.38), 0 24px 56px rgba(0,0,0,0.46);
      --ring:rgba(182,223,63,0.32);
      --soft-ok:rgba(76,175,47,0.12); --soft-bad:rgba(239,68,68,0.12); --soft-warn:rgba(217,119,6,0.13);
      --soft-info:rgba(59,130,246,0.13); --soft-purple:rgba(168,85,247,0.13); --soft-neutral:rgba(255,255,255,0.045);
      --modal-bg:#141a26; --modal-bg2:#1b2231;
      --soft-ok-brd:rgba(76,175,47,0.34); --soft-bad-brd:rgba(239,68,68,0.34); --soft-warn-brd:rgba(217,119,6,0.36);
      --soft-info-brd:rgba(59,130,246,0.36); --soft-purple-brd:rgba(168,85,247,0.36);
    }
    body { background: var(--bg-deep, #eef1f6); min-height: 100vh; padding: 28px 24px; transition: background 0.25s; }
    html[data-theme="dark"] body {
      background:
        radial-gradient(1100px 640px at 8% -8%, rgba(149,193,31,0.20), transparent 60%),
        radial-gradient(1000px 620px at 100% 0%, rgba(37,99,235,0.13), transparent 55%),
        radial-gradient(820px 560px at 88% 108%, rgba(149,193,31,0.14), transparent 60%),
        #070a12;
      background-attachment: fixed;
    }
    /* ════════════ GLASS  ·  html[data-vfx="glass"] ════════════
       An optional finish. Everything here is decoration only: no layout moves,
       no text loses contrast, and dialogs stay fully opaque on purpose — the
       whole point of a dialog is that you cannot read the page through it. */

    /* a slow aurora behind the page, painted under the existing body gradient */
    html[data-aurora="on"] body::before {
      content: ""; position: fixed; inset: -12%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(48% 42% at 24% 26%, rgba(149,193,31,0.38), transparent 68%),
        radial-gradient(44% 40% at 78% 20%, rgba(56,132,255,0.34), transparent 66%),
        radial-gradient(42% 38% at 66% 82%, rgba(192,38,211,0.26), transparent 68%),
        radial-gradient(40% 36% at 34% 72%, rgba(0,209,178,0.20), transparent 70%);
      opacity: 1;
      animation: qaAurora 34s ease-in-out infinite alternate;
    }
    html[data-aurora="on"][data-theme="light"] body::before { opacity: 0.45; }
    @keyframes qaAurora {
      0%   { transform: translate3d(-2%, -1.5%, 0) scale(1); }
      50%  { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
      100% { transform: translate3d(-1.5%, 2%, 0) scale(1.02); }
    }
    html[data-aurora="on"] body > * { position: relative; z-index: 1; }

    /* frosted cards: a touch of blur and a hairline of light along the top edge */
    html[data-vfx="glass"] .glass-card,
    html[data-vfx="glass"] [data-glass] {
      position: relative;
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 0 40px rgba(255,255,255,0.03);
    }
    html[data-vfx="glass"][data-theme="light"] .glass-card,
    html[data-vfx="glass"][data-theme="light"] [data-glass] {
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.75);
    }
    html[data-vfx="glass"] .glass-card::after,
    html[data-vfx="glass"] [data-glass]::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(150deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 34%, rgba(255,255,255,0) 60%);
    }
    html[data-vfx="glass"][data-theme="light"] .glass-card::after,
    html[data-vfx="glass"][data-theme="light"] [data-glass]::after {
      background: linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 46%);
    }

    /* small tiles lift and catch the accent when pointed at */
    html[data-vfx="glass"] .glass-tile {
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
    }
    html[data-vfx="glass"] .glass-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.30), 0 0 0 1px rgba(149,193,31,0.28);
    }

    /* the masthead reads as glass over whatever scrolls beneath it */
    html[data-vfx="glass"] .glass-head {
      backdrop-filter: blur(26px) saturate(165%);
      -webkit-backdrop-filter: blur(26px) saturate(165%);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.20);
      overflow: hidden;
    }
    /* a slow bolt of light travelling along the masthead — the one bit of flourish */
    html[data-vfx="glass"] .glass-head::before {
      content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 2px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(149,193,31,0.10), #b6df3f, rgba(149,193,31,0.10), transparent);
      filter: blur(0.4px);
      animation: qaSweep 7s ease-in-out infinite;
    }
    @keyframes qaSweep {
      0%   { left: -40%; opacity: 0; }
      12%  { opacity: 1; }
      60%  { opacity: 1; }
      100% { left: 100%; opacity: 0; }
    }

    /* one soft pulse on the brand accent, so the live release reads as live */
    html[data-vfx="glass"] .glass-pulse { animation: qaPulse 3.4s ease-in-out infinite; }
    @keyframes qaPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(149,193,31,0.42); }
      60%      { box-shadow: 0 0 0 7px rgba(149,193,31,0); }
    }

    /* Nothing above is worth motion sickness. */
    @media (prefers-reduced-motion: reduce) {
      html[data-aurora="on"] body::before { animation: none; }
      html[data-vfx="glass"] .glass-head::before { animation: none; opacity: 0; }
      html[data-vfx="glass"] .glass-pulse { animation: none; }
      html[data-vfx="glass"] .glass-tile { transition: none; }
      html[data-vfx="glass"] .glass-tile:hover { transform: none; }
    }
    /* Printing is a document, not a light show. */
    @media print {
      html[data-aurora="on"] body::before { display: none; }
      html[data-vfx="glass"] .glass-card,
      html[data-vfx="glass"] [data-glass],
      html[data-vfx="glass"] .glass-head { backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
      html[data-vfx="glass"] .glass-head::before { display: none; }
      html[data-vfx="glass"] .glass-card::after,
      html[data-vfx="glass"] [data-glass]::after { display: none; }
    }

    html[data-theme="light"] body {
      background:
        radial-gradient(1000px 600px at 6% -8%, rgba(149,193,31,0.14), transparent 60%),
        radial-gradient(900px 560px at 100% 0%, rgba(37,99,235,0.06), transparent 55%),
        radial-gradient(760px 520px at 90% 108%, rgba(149,193,31,0.10), transparent 60%),
        #eef1f6;
      background-attachment: fixed;
    }
    #report-root div[style*="var(--card-bg)"] { border: 1px solid var(--card-brd); }
    html[data-theme="dark"] #report-root div[style*="var(--card-bg)"] {
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
    }
    html[data-theme="dark"] #report-root div[style*="var(--card-bg2)"] {
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
    }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] select, html[data-theme="dark"] option { background-color: #14213a; color: #e6eefb; }
    :focus-visible { outline: 2px solid #95c11f; outline-offset: 2px; }
    @keyframes qaPulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    @media (max-width: 1100px) {
      #report-root div[style*="minmax(0,1fr) 372px"] { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 700px) {
      body { padding: 14px 10px; }
      #report-root div[style*="grid-template-columns:1fr 1fr"],
      #report-root div[style*="repeat(3,1fr)"],
      #report-root div[style*="repeat(2,1fr)"],
      #report-root div[data-summary-grid] { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 1250px) {
      #report-root div[data-summary-grid] { grid-template-columns: 1fr 1fr !important; }
      #report-root div[data-summary-grid] > div[style*="min-height"] { display: none; }
      #report-root div[data-summary-grid] > div[style*="150px"] { grid-column: 1 / -1; }
    }
    /* ══ COMPONENT LAYER ══════════════════════════════════════════════════
       One button, card and chip vocabulary. The report's inline styles still
       win where they are set, so these classes are used by the new chrome
       (masthead, toolbars) and supply the shared hover/focus behaviour. */
    .qb {
      font-family:'Rubik',sans-serif; font-size:12.5px; font-weight:600; line-height:1;
      border-radius:var(--r-md); padding:9px 14px; cursor:pointer; white-space:nowrap;
      display:inline-flex; align-items:center; justify-content:center; gap:7px;
      border:1px solid transparent; background:transparent; color:inherit;
      transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                 color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .qb:hover { transform:translateY(-1px); }
    .qb:active { transform:translateY(0); }
    .qb-ico { font-size:13px; line-height:1; }
    /* masthead variants — always on the dark brand surface */
    .qb-primary { background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%); color:#141d06; box-shadow:0 1px 0 rgba(255,255,255,0.22) inset, 0 6px 16px rgba(149,193,31,0.28); }
    .qb-primary:hover { box-shadow:0 1px 0 rgba(255,255,255,0.28) inset, 0 10px 22px rgba(149,193,31,0.38); }
    .qb-soft { background:var(--hd-soft); border-color:var(--hd-brd); color:var(--hd-tx); }
    .qb-soft:hover { background:var(--hd-soft-2); border-color:var(--hd-brd-2); }
    .qb-quiet { background:transparent; border-color:var(--hd-brd); color:var(--hd-tx-mut); }
    .qb-quiet:hover { background:var(--hd-soft); color:var(--hd-tx); border-color:var(--hd-brd-2); }
    .qb-accent { background:rgba(149,193,31,0.12); border-color:rgba(149,193,31,0.45); color:var(--brand-light); }
    .qb-accent:hover { background:rgba(149,193,31,0.2); border-color:var(--brand); }
    .qb-gate { background:rgba(234,88,12,0.14); border-color:rgba(251,146,60,0.5); color:#fdba74; }
    .qb-gate:hover { background:rgba(234,88,12,0.24); border-color:#fb923c; }
    .qb-sm { font-size:11.5px; padding:7px 11px; }
    .qb-icon { padding:0; width:32px; height:32px; }
    /* a segmented pair reads as one control */
    .qb-group { display:inline-flex; align-items:stretch; border:1px solid var(--hd-brd); border-radius:var(--r-md); overflow:hidden; }
    .qb-group > .qb { border-radius:0; border:none; }
    .qb-group > .qb:hover { transform:none; }
    .qb-group > .qb + .qb { border-left:1px solid var(--hd-brd); }
    /* masthead meta chips */
    .qchip {
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
      background:var(--hd-soft); border:1px solid var(--hd-brd); border-radius:var(--r-sm);
      padding:5px 11px; font-size:11.5px; font-weight:500; color:var(--hd-tx-mut);
    }
    .qchip b { font-weight:650; color:var(--hd-tx); }
    .qchip .on { color:var(--brand-light); font-weight:650; }
    .qchip-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    /* shared interaction polish across the whole report */
    #report-root button, #report-root label[style*="cursor:pointer"], #report-root a {
      transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                 color var(--dur) var(--ease), opacity var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    #report-root button:not(.qb):not([data-flat]):hover { filter:brightness(1.07); }
    #report-root input:focus, #report-root textarea:focus, #report-root select:focus {
      border-color:var(--brand) !important; box-shadow:0 0 0 3px var(--ring);
    }
    :focus-visible { outline:2px solid var(--brand); outline-offset:2px; border-radius:var(--r-xs); }
    /* quieter scrollbars everywhere */
    #report-root *::-webkit-scrollbar { width:9px; height:9px; }
    #report-root *::-webkit-scrollbar-track { background:transparent; }
    #report-root *::-webkit-scrollbar-thumb { background:var(--brd-2); border-radius:var(--r-pill); border:2px solid transparent; background-clip:content-box; }
    #report-root *::-webkit-scrollbar-thumb:hover { background:var(--tx-faint); background-clip:content-box; }
    #report-root { scrollbar-width:thin; }

    /* ── Release navigation: sticky beside the report, stacked on small screens ── */
    #release-nav { scrollbar-width: thin; }
    #release-nav ::-webkit-scrollbar, #release-nav::-webkit-scrollbar { width: 7px; }
    #release-nav ::-webkit-scrollbar-thumb, #release-nav::-webkit-scrollbar-thumb { background: var(--brd-2); border-radius: 4px; }
    @media (max-width: 1100px) {
      #qa-shell { flex-direction: column; }
      #release-nav { width: 100% !important; flex: 0 0 auto !important; position: static !important; max-height: 320px; }
      #report-body { width: 100%; }
    }
    @media (max-width: 760px) {
      #release-nav { max-height: 240px; }
      /* the timeline's trailing date column has no room — the row title carries it */
      #report-root [data-rel-timeline-dates] { display: none !important; }
    }
    @media print {
      #release-nav { display: none !important; }
      #qa-shell { display: block !important; }
    }
    @media print { body { background: white !important; padding: 0; } }
    /* ── PDF STATUS REPORT: on-screen hidden, isolated for print ── */
    #pdf-report { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      #report-root { display: block !important; max-width: none !important; }
      #report-root > *:not(#pdf-report) { display: none !important; }
      #pdf-report { display: block !important; }
      #pdf-report .rpt-card { break-inside: auto; }
      #pdf-report .rpt-row { break-inside: avoid; }
      #pdf-report .rpt-break { break-before: page; }
      #report-root { gap: 0 !important; padding: 0 !important; margin: 0 !important; }
      #pdf-report > *:first-child { margin-top: 0 !important; break-before: avoid !important; }
      html, body { height: auto !important; overflow: visible !important; }
      body *[style*="position:fixed"], body *[style*="position: fixed"] { display: none !important; }
    }
  </style>
</helmet>
